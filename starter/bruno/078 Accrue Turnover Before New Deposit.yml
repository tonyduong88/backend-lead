http:
  method: POST
  url: "{{baseUrl}}/wallets/{{walletId}}/wagers"
  headers:
    - name: Accept
      value: application/json
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "amount": "20"
      }
runtime:
  scripts:
