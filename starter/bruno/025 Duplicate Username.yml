info:
  name: "025 Duplicate Username"
  type: http
  seq: 25
http:
  method: POST
  url: "{{baseUrl}}/members"
  headers:
    - name: Accept
      value: application/json
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "username": "{{username}}"
      }
runtime:
  scripts:
    - type: tests
      code: |-
        test("HTTP 409", function () { expect(res.status).to.equal(409); });
        test("error", function () { expect(res.body["error"]).to.equal("username_taken"); });
settings:
  encodeUrl: true
docs:
  type: text/markdown
  content: |-
    Expected HTTP 409. Run in numbered order after this scenario's Create Member request. Amounts and monetary assertions use strings.
