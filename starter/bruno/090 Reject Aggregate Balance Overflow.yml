info:
  name: "090 Reject Aggregate Balance Overflow"
  type: http
  seq: 90
http:
  method: POST
  url: "{{baseUrl}}/psp/callbacks"
  headers:
    - name: Accept
      value: application/json
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "pspRef": "{{overflowRef}}",
        "status": "completed",
        "amount": "1"
      }
runtime:
  scripts:
    - type: tests
      code: |-
        test("HTTP 422", function () { expect(res.status).to.equal(422); });
        test("error", function () { expect(res.body["error"]).to.equal("money_out_of_range"); });
settings:
  encodeUrl: true
docs:
  type: text/markdown
  content: |-
    Expected HTTP 422. Run in numbered order after this scenario's Create Member request. Amounts and monetary assertions use strings.
