http:
  method: POST
  url: "{{baseUrl}}/psp/callbacks"
  headers:
    - name: Accept
      value: application/json
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "pspRef": "{{baseRef}}",
        "status": "completed",
        "amount": "100.000"
